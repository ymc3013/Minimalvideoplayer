name: Build Minimalvideoplayer

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'Makefile'
      - 'source/**'
      - 'third_party/decoder/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 3DSX
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure devkitPro
        shell: bash
        run: |
          set -eu

          test -n "${DEVKITPRO:-}" || {
            echo "::error::DEVKITPRO is not configured."
            exit 1
          }

          test -n "${DEVKITARM:-}" || {
            echo "::error::DEVKITARM is not configured."
            exit 1
          }

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"

          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          make --version

      - name: Install required devkitPro packages
        shell: bash
        run: |
          set -eu
          if ! command -v dkp-pacman >/dev/null 2>&1; then
            echo "::error::dkp-pacman is missing from the container."
            exit 1
          fi

          # Update and install the exact SDK libs we need (explicit names)
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --needed --noconfirm \
            devkitARM \
            libctru \
            citro2d \
            citro3d \
            arm-none-eabi-zlib

      - name: Show installed SDK library directories (debug)
        shell: bash
        run: |
          set -eu
          echo "DEVKITPRO=$DEVKITPRO"
          echo "Listing expected library directories:"
          ls -la "$DEVKITPRO" || true
          ls -la "$DEVKITPRO/libctru/lib" || true
          ls -la "$DEVKITPRO/citro2d/lib" || true
          ls -la "$DEVKITPRO/citro3d/lib" || true
          ls -la "$DEVKITPRO/libz/lib" || true
          echo "Find libctru/libcitro2d/libcitro3d/libz:"
          find "$DEVKITPRO" -type f \( -name "libctru.a" -o -name "libcitro2d.a" -o -name "libcitro3d.a" -o -name "libz.a" \) -print || true

      - name: Verify project files & bundled libs
        shell: bash
        run: |
          set -eu
          test -f Makefile
          test -f source/main.c
          test -f source/avi.c
          test -f source/video.c
          test -f source/audio.c

          LIB="third_party/decoder/lib"
          for lib in \
            libswresample.a \
            libavformat.a \
            libswscale.a \
            libavcodec.a \
            libavutil.a \
            libx264.a \
            libmp3lame.a \
            libdav1d.a \
            libcurl.a \
            libmbedtls.a \
            libmbedx509.a \
            libmbedcrypto.a \
            libnghttp2.a
          do
            if [ ! -s "$LIB/$lib" ]; then
              echo "::error::Missing library: $LIB/$lib"
              exit 1
            fi
          done

          echo "Project dependencies verified."

      - name: Build Minimalvideoplayer
        shell: bash
        run: |
          set -eu

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          # Avoid linking against the incompatible bundled libctru.
          BUNDLED="third_party/decoder/lib/libctru.a"
          DISABLED="third_party/decoder/lib/libctru.a.disabled"

          if [ -e "$DISABLED" ]; then
            echo "::error::Unexpected leftover $DISABLED"
            exit 1
          fi

          restore_ctru() {
            if [ -e "$DISABLED" ]; then
              mv "$DISABLED" "$BUNDLED"
            fi
          }
          trap restore_ctru EXIT

          if [ -f "$BUNDLED" ]; then
            mv "$BUNDLED" "$DISABLED"
          fi

          make clean
          make -j2 V=1

          test -s Minimalvideoplayer.3dsx
          ls -lh Minimalvideoplayer.3dsx

      - name: Upload 3DSX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minimalvideoplayer-3dsx
          path: Minimalvideoplayer.3dsx
          if-no-files-found: error
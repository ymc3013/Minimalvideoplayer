
name: Build Minimalvideoplayer

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'Makefile'
      - 'source/**'
      - 'third_party/decoder/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 3DSX
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install devkitPro SDK and libraries
        shell: bash
        run: |
          set -eu

          export PATH="/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:$PATH"

          command -v dkp-pacman

          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm \
            devkitARM \
            3ds-dev \
            citro2d \
            citro3d \
            libctru

          command -v arm-none-eabi-gcc
          command -v make

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

      - name: Locate SDK libraries
        shell: bash
        run: |
          set -eu

          find_library() {
            name="$1"
            result="$(find "$DEVKITPRO" -type f -name "$name" -print -quit)"

            if [ -z "$result" ]; then
              echo "::error::Cannot find $name under $DEVKITPRO"
              exit 1
            fi

            dirname "$result"
          }

          CTRU_DIR="$(find_library libctru.a)"
          CITRO2D_DIR="$(find_library libcitro2d.a)"
          CITRO3D_DIR="$(find_library libcitro3d.a)"
          ZLIB_DIR="$(find_library libz.a)"

          {
            echo "SDK_CTRU_DIR=$CTRU_DIR"
            echo "SDK_CITRO2D_DIR=$CITRO2D_DIR"
            echo "SDK_CITRO3D_DIR=$CITRO3D_DIR"
            echo "SDK_ZLIB_DIR=$ZLIB_DIR"
          } >> "$GITHUB_ENV"

          echo "libctru: $CTRU_DIR"
          echo "libcitro2d: $CITRO2D_DIR"
          echo "libcitro3d: $CITRO3D_DIR"
          echo "libz: $ZLIB_DIR"

      - name: Verify decoder libraries
        shell: bash
        run: |
          set -eu

          LIB="third_party/decoder/lib"

          for lib in \
            libswresample.a \
            libavformat.a \
            libswscale.a \
            libavcodec.a \
            libavutil.a \
            libx264.a \
            libmp3lame.a \
            libdav1d.a \
            libcurl.a \
            libnghttp2.a \
            libmbedtls.a \
            libmbedx509.a \
            libmbedcrypto.a
          do
            if [ ! -s "$LIB/$lib" ]; then
              echo "::error::Missing decoder library: $LIB/$lib"
              exit 1
            fi
          done

      - name: Build Minimalvideoplayer
        shell: bash
        run: |
          set -eu

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          BUNDLED="third_party/decoder/lib/libctru.a"
          DISABLED="third_party/decoder/lib/libctru.a.disabled"

          if [ -e "$DISABLED" ]; then
            echo "::error::Unexpected leftover $DISABLED"
            exit 1
          fi

          restore_ctru() {
            if [ -e "$DISABLED" ]; then
              mv "$DISABLED" "$BUNDLED"
            fi
          }
          trap restore_ctru EXIT

          if [ -f "$BUNDLED" ]; then
            mv "$BUNDLED" "$DISABLED"
          fi

          make clean
          make -j2 V=1

          test -s Minimalvideoplayer.3dsx
          ls -lh Minimalvideoplayer.3dsx

      - name: Upload 3DSX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minimalvideoplayer-3dsx
          path: Minimalvideoplayer.3dsx
          if-no-files-found: error

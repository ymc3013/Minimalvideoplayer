name: DualScreenVideoPlayer

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          command -v 3dsxtool
          test -f "$DEVKITPRO/libctru/include/3ds.h"

          "$DEVKITARM/bin/arm-none-eabi-gcc" --version

      - name: Generate test application
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source

          cat > source/main.c <<'EOF'
          #include <3ds.h>
          #include <stdio.h>

          int main(void)
          {
              gfxInitDefault();
              consoleInit(GFX_TOP, NULL);

              printf("DualScreenVideoPlayer\n");
              printf("=====================\n\n");
              printf("Build successful!\n");
              printf("Press START to exit.\n");

              while (aptMainLoop())
              {
                  hidScanInput();

                  if (hidKeysDown() & KEY_START)
                      break;

                  gspWaitForVBlank();
              }

              gfxExit();
              return 0;
          }
          EOF

      - name: Compile and link with ARM GCC
        shell: bash
        run: |
          set -euo pipefail

          "$DEVKITARM/bin/arm-none-eabi-gcc" \
            -g -O2 -Wall -Wextra \
            -march=armv6k \
            -mtune=mpcore \
            -mfloat-abi=hard \
            -mtp=soft \
            -mword-relocations \
            -ffunction-sections \
            -fdata-sections \
            -D__3DS__ \
            -I"$DEVKITPRO/libctru/include" \
            -specs=3dsx.specs \
            -Wl,--gc-sections \
            source/main.c \
            -L"$DEVKITPRO/libctru/lib" \
            -lctru -lm \
            -o DualScreenVideoPlayer.elf

      - name: Create 3DSX
        shell: bash
        run: |
          set -euo pipefail

          3dsxtool DualScreenVideoPlayer.elf \
            DualScreenVideoPlayer.3dsx

          test -s DualScreenVideoPlayer.3dsx
          ls -lh DualScreenVideoPlayer.3dsx

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: DualScreenVideoPlayer-3DSX
          path: DualScreenVideoPlayer.3dsx
          if-no-files-found: error
          retention-days: 14
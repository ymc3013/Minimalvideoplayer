
name: MinimalVideoPlayer - Automatic Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build automatic AVI player
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check toolchain
        shell: bash
        run: |
          set -eu
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          command -v make
          command -v git
          command -v python3

      - name: Download original video engine
        shell: bash
        run: |
          set -eu
          git clone --depth 1 \
            https://github.com/Core-2-Extreme/Video_player_for_3DS.git \
            upstream

          test -f upstream/Makefile
          test -f upstream/source/main.c
          test -f upstream/source/video_player.c
          test -f upstream/include/video_player.h

      - name: Patch player for automatic playback
        shell: bash
        run: |
          set -eu

          cat > /tmp/patch_player.py <<'PYTHON'
          from pathlib import Path
          import re

          root = Path("upstream")
          player = root / "source/video_player.c"

          text = player.read_text()

          def patch_function(source, name, edits):
              pattern = (
                  r'(static void ' + re.escape(name) +
                  r'\(void\)\s*\{.*?\n\})'
              )
              match = re.search(pattern, source, re.S)
              if not match:
                  raise SystemExit(
                      f"Could not locate function: {name}"
                  )

              body = match.group(1)
              for old, new in edits:
                  if old not in body:
                      raise SystemExit(
                          f"Expected code missing in {name}: {old}"
                      )
                  body = body.replace(old, new, 1)

              return source[:match.start()] + body + source[match.end():]

          # Hide the controls and enable full-screen mode.
          text = patch_function(
              text,
              "Vid_init_ui_data",
              [
                  (
                      "vid_player.is_full_screen = false;",
                      "vid_player.is_full_screen = true;"
                  ),
                  (
                      "vid_player.turn_off_bottom_screen_count = 0;",
                      "vid_player.turn_off_bottom_screen_count = 1;"
                  ),
                  (
                      "vid_player.menu_mode = MENU_CONTROLS;",
                      "vid_player.menu_mode = MENU_MAX;"
                  ),
              ],
          )

          # Do not show the full-screen instruction overlay.
          text = patch_function(
              text,
              "Vid_init_hidden_settings",
              [
                  (
                      "vid_player.show_full_screen_msg = true;",
                      "vid_player.show_full_screen_msg = false;"
                  ),
              ],
          )

          # Queue playback only after the engine has initialized.
          marker = (
              '\tVid_resume();\n\n'
              '\tDEF_LOG_STRING("Initialized.");'
          )

          autoplay = r'''
              // MinimalVideoPlayer: play the configured AVI automatically.
              Vid_file *auto_file = malloc(sizeof(Vid_file));

              if (auto_file)
              {
                  memset(auto_file, 0, sizeof(*auto_file));
                  snprintf(auto_file->directory,
                           sizeof(auto_file->directory),
                           "%s", "sdmc:/Movies/");
                  snprintf(auto_file->name,
                           sizeof(auto_file->name),
                           "%s", "test.avi");
                  auto_file->index = 0;

                  uint32_t play_result = Util_queue_add(
                      &vid_player.decode_thread_command_queue,
                      DECODE_THREAD_PLAY_REQUEST,
                      auto_file,
                      QUEUE_OP_TIMEOUT_US,
                      QUEUE_OPTION_NONE
                  );

                  if (play_result != DEF_SUCCESS)
                      free(auto_file);
              }
          '''

          if marker not in text:
              raise SystemExit(
                  "Could not locate the end of Vid_init(). "
                  "The upstream source may have changed."
              )

          text = text.replace(
              marker,
              '\tVid_resume();\n' + autoplay +
              '\n\tDEF_LOG_STRING("Initialized.");',
              1
          )

          player.write_text(text)

          # Replace main.c without running the original menu loop.
          main_c = '''#include <stdbool.h>
          #include <stdint.h>
          #include "3ds.h"
          #include "system/menu.h"
          #include "video_player.h"

          int main(void)
          {
              Menu_init();
              Vid_init(false);

              while (aptMainLoop())
              {
                  Vid_main();
              }

              Vid_exit(false);
              Menu_exit();
              return 0;
          }
          '''

          (root / "source/main.c").write_text(main_c)

          # Verify the requested changes before compiling.
          patched = player.read_text()

          assert "DECODE_THREAD_PLAY_REQUEST" in patched
          assert '"sdmc:/Movies/"' in patched
          assert '"test.avi"' in patched
          assert "vid_player.menu_mode = MENU_MAX;" in patched
          assert "Menu_main();" not in main_c

          print("Automatic-playback patch applied.")
          PYTHON

          python3 /tmp/patch_player.py

      - name: Compile player
        shell: bash
        working-directory: upstream
        run: |
          set -eu
          make clean
          make 3dsx

          find . -maxdepth 2 -type f -name '*.3dsx' -print
          test -s upstream.3dsx

      - name: Prepare artifact
        shell: bash
        run: |
          set -eu
          mkdir -p output
          cp upstream/upstream.3dsx \
            output/Minimalvideoplayer.3dsx
          test -s output/Minimalvideoplayer.3dsx

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Minimalvideoplayer-3DSX
          path: output/Minimalvideoplayer.3dsx
          if-no-files-found: error
          retention-days: 14


name: MinimalVideoPlayer - Autonomous Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MinimalVideoPlayer
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check devkitPro tools
        shell: bash
        run: |
          set -eu
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          test -f "$DEVKITARM/3ds_rules"
          command -v make
          command -v git
          command -v python3
          command -v smdhtool

      - name: Fetch decoder libraries
        shell: bash
        run: |
          set -eu

          # Fetch the libraries only; never build or launch the old player.
          git clone --depth 1 \
            https://github.com/Core-2-Extreme/Video_player_for_3DS.git \
            /tmp/decoder-dependencies

          test -d /tmp/decoder-dependencies/library/include
          test -d /tmp/decoder-dependencies/library/lib

          mkdir -p source library
          cp -a /tmp/decoder-dependencies/library/include/. \
            library/include/
          cp -a /tmp/decoder-dependencies/library/lib/. \
            library/lib/

          for lib in avformat avcodec avutil swscale swresample; do
            if ! find library/lib -maxdepth 1 \
              -name "lib${lib}.a" -print -quit | grep -q .; then
              echo "Missing static decoder library: lib${lib}.a"
              exit 1
            fi
          done

      - name: Generate application icon
        shell: bash
        run: |
          set -eu

          python3 - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          def chunk(name, data):
              block = name + data
              return (
                  struct.pack(">I", len(data))
                  + block
                  + struct.pack(">I", zlib.crc32(block) & 0xffffffff)
              )

          width = height = 48
          row = b"\x00" + bytes([28, 28, 42, 255]) * width
          image = b"".join(row for _ in range(height))

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(
                  ">IIBBBBB", width, height, 8, 6, 0, 0, 0
              ))
              + chunk(b"IDAT", zlib.compress(image))
              + chunk(b"IEND", b"")
          )

          Path("icon.png").write_bytes(png)
          PY

      - name: Generate autonomous player source
        shell: bash
        run: |
          set -eu

          cat > source/main.c <<'EOF'
          #include <stdio.h>
          #include <3ds.h>
          #include <libavformat/avformat.h>
          #include <libavcodec/avcodec.h>

          #define VIDEO_PATH "sdmc:/Movies/test.avi"

          int main(void)
          {
              gfxInitDefault();
              consoleInit(GFX_TOP, NULL);

              AVFormatContext *format = NULL;
              int result;
              int video_index = -1;
              int audio_index = -1;

              printf("MinimalVideoPlayer\n");
              printf("Opening test.avi...\n\n");

              result = avformat_open_input(
                  &format, VIDEO_PATH, NULL, NULL
              );

              if (result < 0) {
                  printf("Could not open AVI.\n");
                  printf("Check sdmc:/Movies/test.avi\n");
                  goto exit_loop;
              }

              result = avformat_find_stream_info(format, NULL);

              if (result < 0) {
                  printf("Could not read AVI streams.\n");
                  avformat_close_input(&format);
                  goto exit_loop;
              }

              for (unsigned int i = 0;
                   i < format->nb_streams; i++) {
                  enum AVMediaType type =
                      format->streams[i]->codecpar->codec_type;

                  if (type == AVMEDIA_TYPE_VIDEO)
                      video_index = (int)i;

                  if (type == AVMEDIA_TYPE_AUDIO)
                      audio_index = (int)i;
              }

              printf("AVI opened successfully.\n");

              if (video_index >= 0) {
                  AVCodecParameters *p =
                      format->streams[video_index]->codecpar;
                  const AVCodec *decoder =
                      avcodec_find_decoder(p->codec_id);

                  printf("Video: %d x %d\n", p->width, p->height);
                  printf("Video decoder: %s\n",
                      decoder ? decoder->name : "not available");
              } else {
                  printf("No video stream found.\n");
              }

              if (audio_index >= 0) {
                  AVCodecParameters *p =
                      format->streams[audio_index]->codecpar;
                  const AVCodec *decoder =
                      avcodec_find_decoder(p->codec_id);

                  printf("Audio decoder: %s\n",
                      decoder ? decoder->name : "not available");
              } else {
                  printf("No audio stream found.\n");
              }

              avformat_close_input(&format);

              printf("\nDecoder test only.\n");
              printf("Video rendering and audio output\n");
              printf("are not implemented yet.\n");

          exit_loop:
              printf("\nPress START to exit.");

              while (aptMainLoop()) {
                  hidScanInput();

                  if (hidKeysDown() & KEY_START)
                      break;

                  gfxFlushBuffers();
                  gfxSwapBuffers();
                  gspWaitForVBlank();
              }

              gfxExit();
              return 0;
          }
          EOF

      - name: Generate standalone Makefile
        shell: bash
        run: |
          set -eu

          cat > Makefile <<'EOF'
          .SUFFIXES:

          ifeq ($(strip $(DEVKITARM)),)
          $(error DEVKITARM is not configured)
          endif

          include $(DEVKITARM)/3ds_rules

          TARGET := Minimalvideoplayer
          BUILD := build
          SOURCES := source
          DATA :=
          INCLUDES := library/include
          GRAPHICS :=
          ROMFS :=
          ICON := icon.png

          APP_TITLE := MinimalVideoPlayer
          APP_DESCRIPTION := Autonomous AVI decoder test
          APP_AUTHOR := ymc3013

          ARCH := -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft

          CFLAGS := -O2 -Wall -mword-relocations \
                    -fomit-frame-pointer $(ARCH)
          CFLAGS += $(INCLUDE) -DARM11 -D_3DS

          LDFLAGS := -specs=3dsx.specs $(ARCH) \
                     -Wl,-Map,$(notdir $*.map)

          LIBDIRS := library/lib $(PORTLIBS) $(CTRULIB)

          LIBS := -lavformat -lavcodec -lswscale -lswresample \
                  -lavutil -lx264 -lmp3lame -ldav1d -lcurl \
                  -lnghttp2 -lmbedtls -lmbedx509 -lmbedcrypto \
                  -lctru -lz -lm

          .PHONY: all clean

          all: 3dsx

          3dsx:
          	$(MAKE) --no-print-directory -C $(BUILD) \
          	  -f $(CURDIR)/Makefile

          clean:
          	rm -rf $(BUILD) $(TARGET).3dsx \
          	  $(TARGET).smdh $(TARGET).elf
          EOF

          # Ensure the generated Makefile uses real tab characters.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Makefile")
          s = p.read_text()
          s = s.replace(
              "\t$(MAKE) --no-print-directory -C $(BUILD) \\\n",
              "\t$(MAKE) --no-print-directory -C $(BUILD) \\\n"
          )
          p.write_text(s)
          PY

      - name: Compile application
        shell: bash
        run: |
          set -eu
          make clean
          make 3dsx
          test -s Minimalvideoplayer.3dsx

          mkdir -p output
          cp Minimalvideoplayer.3dsx output/
          test -s output/Minimalvideoplayer.3dsx
          ls -lh output/Minimalvideoplayer.3dsx

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Minimalvideoplayer-3DSX
          path: output/Minimalvideoplayer.3dsx
          if-no-files-found: error
          retention-days: 14

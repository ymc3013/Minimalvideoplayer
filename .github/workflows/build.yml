
name: Build Minimalvideoplayer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4

      - name: Download video player source
        run: |
          git clone --depth 1 \
            https://github.com/Core-2-Extreme/Video_player_for_3DS.git \
            upstream

      - name: Compile 3DSX
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/upstream:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            bash -lc 'make 3dsx'

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Minimalvideoplayer-3DSX
          path: upstream/*.3dsx
          if-no-files-found: error

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add devkitPro APT repository (without apt-key)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg
          # Download the devkitPro key and store it as a dearmored keyring
          curl -fsSL https://apt.devkitpro.org/devkitpro-keyring.gpg | gpg --dearmor | sudo tee /usr/share/keyrings/devkitpro-archive-keyring.gpg > /dev/null
          # Add the repo and reference the keyring with signed-by
          echo "deb [signed-by=/usr/share/keyrings/devkitpro-archive-keyring.gpg] https://apt.devkitpro.org stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update
          sudo apt-get install -y devkitpro-pacman

      - name: Install devkitARM and zlib
        run: |
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --noconfirm devkitARM arm-none-eabi-zlib

      - name: Set DEVKITPRO and DEVKITARM
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV

      - name: Build
        env:
          DEVKITPRO: ${{ env.DEVKITPRO }}
          DEVKITARM: ${{ env.DEVKITARM }}
        run: |
          set -eu
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          make clean
          make -j2 V=1

          test -s Minimalvideoplayer.3dsx
          ls -lh Minimalvideoplayer.3dsx
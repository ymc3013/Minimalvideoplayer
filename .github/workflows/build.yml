name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install devkitPro pacman
        run: |
          sudo tee /etc/apt/sources.list.d/devkitpro.list > /dev/null <<'EOF'
          deb https://apt.devkitpro.org stable main
          EOF
          wget -qO- https://apt.devkitpro.org/devkitpro-keyring.gpg | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y devkitpro-pacman

      - name: Install devkitARM and zlib
        run: |
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --noconfirm devkitARM arm-none-eabi-zlib

      - name: Set DEVKITPRO and DEVKITARM
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV

      - name: Build
        env:
          DEVKITPRO: ${{ env.DEVKITPRO }}
          DEVKITARM: ${{ env.DEVKITARM }}
        run: |
          set -eu
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          # ajustez les flags make si nécessaire
          make clean
          make -j2 V=1

          test -s Minimalvideoplayer.3dsx
          ls -lh Minimalvideoplayer.3dsx
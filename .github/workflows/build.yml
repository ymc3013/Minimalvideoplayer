
name: Minimalvideoplayer Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nintendo 3DS application
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build tools
        shell: bash
        run: |
          set -eu
          test -f "$DEVKITARM/3ds_rules"
          command -v git
          command -v make

      - name: Clone upstream player
        shell: bash
        run: |
          set -eu
          git clone --depth 1 \
            https://github.com/Core-2-Extreme/Video_player_for_3DS.git \
            upstream
          test -f upstream/Makefile

      - name: Compile upstream player
        shell: bash
        working-directory: upstream
        run: |
          set -eu
          make clean
          make 3dsx

          echo "Generated 3DSX files:"
          find . -maxdepth 2 -type f -name '*.3dsx' -print

          test -s upstream.3dsx

      - name: Prepare artifact
        shell: bash
        run: |
          set -eu
          mkdir -p output
          cp upstream/upstream.3dsx \
            output/Minimalvideoplayer.3dsx
          ls -lh output/Minimalvideoplayer.3dsx

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Minimalvideoplayer-3DSX
          path: output/Minimalvideoplayer.3dsx
          if-no-files-found: error
          retention-days: 14

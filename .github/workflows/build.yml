
name: Build Minimalvideoplayer

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'Makefile'
      - 'source/**'
      - 'third_party/decoder/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 3DSX
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure devkitPro
        shell: bash
        run: |
          set -eu

          test -n "${DEVKITPRO:-}" || {
            echo "::error::DEVKITPRO is not configured."
            exit 1
          }

          test -n "${DEVKITARM:-}" || {
            echo "::error::DEVKITARM is not configured."
            exit 1
          }

          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          arm-none-eabi-gcc --version
          make --version

      - name: Verify project files
        shell: bash
        run: |
          set -eu

          test -f Makefile
          test -f source/main.c

          for file in \
            third_party/decoder/include/libavformat/avformat.h \
            third_party/decoder/include/libavcodec/avcodec.h \
            third_party/decoder/lib/libswresample.a \
            third_party/decoder/lib/libavformat.a \
            third_party/decoder/lib/libswscale.a \
            third_party/decoder/lib/libavcodec.a
          do
            if [ ! -f "$file" ]; then
              echo "::error::Missing dependency: $file"
              exit 1
            fi
          done

          if [ ! -f third_party/decoder/lib/libavutil.a ]; then
            if [ -f third_party/decoder/lib/lubavutil.a ]; then
              ln -s lubavutil.a third_party/decoder/lib/libavutil.a
            else
              echo "::error::Missing libavutil.a and lubavutil.a"
              exit 1
            fi
          fi

          echo "Project files verified."

      - name: Locate SDK libraries
        shell: bash
        run: |
          set -eu

          echo "=== SDK configuration ==="
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          echo "=== System library archives ==="
          for lib in libctru.a libcitro2d.a libcitro3d.a libz.a; do
            echo "--- $lib ---"
            find "$DEVKITPRO" -type f -name "$lib" -print || true
          done

          echo "=== Compiler search directories ==="
          arm-none-eabi-gcc -print-search-dirs

          echo "=== 3DS build rules ==="
          test -f "$DEVKITARM/3ds_rules"
          grep -nE 'LIBDIRS|LDFLAGS|LIBS|DEVKITPRO|PORTLIBS' \
            "$DEVKITARM/3ds_rules" || true

      - name: Build Minimalvideoplayer
        shell: bash
        run: |
          set -eu

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          # Prevent the old bundled libctru from shadowing the SDK.
          BUNDLED_CTRU="third_party/decoder/lib/libctru.a"
          DISABLED_CTRU="third_party/decoder/lib/libctru.a.disabled"

          if [ -e "$DISABLED_CTRU" ]; then
            echo "::error::Unexpected libctru.a.disabled file."
            exit 1
          fi

          restore_ctru() {
            if [ -e "$DISABLED_CTRU" ]; then
              mv "$DISABLED_CTRU" "$BUNDLED_CTRU"
            fi
          }

          trap restore_ctru EXIT

          if [ -f "$BUNDLED_CTRU" ]; then
            mv "$BUNDLED_CTRU" "$DISABLED_CTRU"
            echo "Temporarily disabled bundled libctru.a."
          fi

          make clean

          # Preserve the complete linker output if the build fails.
          set +e
          make -j2 V=1
          BUILD_STATUS=$?
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_STATUS."
            echo "=== Available SDK libraries ==="
            find "$DEVKITPRO" -type f \
              \( -name 'libctru.a' -o \
                 -name 'libcitro2d.a' -o \
                 -name 'libcitro3d.a' -o \
                 -name 'libz.a' \) -print || true
            exit "$BUILD_STATUS"
          fi

          if [ ! -s Minimalvideoplayer.3dsx ]; then
            echo "::error::The 3DSX output is missing or empty."
            exit 1
          fi

          ls -lh Minimalvideoplayer.3dsx

      - name: Upload 3DSX artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Minimalvideoplayer-3dsx
          path: Minimalvideoplayer.3dsx
          if-no-files-found: error

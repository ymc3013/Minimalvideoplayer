
name: Import video decoding libraries

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  import-libraries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Minimalvideoplayer
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download upstream library files only
        run: |
          git clone --depth 1 \
            https://github.com/Core-2-Extreme/Video_player_for_3DS.git \
            /tmp/video-reference

          mkdir -p third_party/decoder

          test -d /tmp/video-reference/library/include
          test -d /tmp/video-reference/library/lib

          rm -rf third_party/decoder/include
          rm -rf third_party/decoder/lib

          cp -a /tmp/video-reference/library/include \
            third_party/decoder/include

          cp -a /tmp/video-reference/library/lib \
            third_party/decoder/lib

          cp /tmp/video-reference/LICENSE \
            third_party/decoder/UPSTREAM_LICENSE.txt

          echo "Imported library files:"
          find third_party/decoder -type f

      - name: Commit library files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add third_party/decoder

          if git diff --cached --quiet; then
            echo "No library changes to commit."
            exit 0
          fi

          git commit -m "Import video decoding libraries"
          git push origin "HEAD:${GITHUB_REF_NAME}"

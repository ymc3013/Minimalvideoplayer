
name: Build Minimalvideoplayer

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'Makefile'
      - 'source/**'
      - 'third_party/decoder/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 3DSX
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install devkitPro SDK and libraries
        shell: bash
        run: |
          set -eu

          export PATH="/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:$PATH"

          if ! command -v dkp-pacman >/dev/null 2>&1; then
            echo "::error::dkp-pacman is unavailable in the container."
            exit 1
          fi

          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm \
            devkitARM \
            3ds-dev \
            citro2d \
            citro3d \
            libctru

          echo "=== Installed SDK ==="
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          arm-none-eabi-gcc --version
          make --version

      - name: Locate SDK libraries
        shell: bash
        run: |
          set -eu

          echo "=== Searching for required libraries ==="

          for lib in \
            libctru.a \
            libcitro2d.a \
            libcitro3d.a \
            libz.a
          do
            echo "--- $lib ---"
            find "$DEVKITPRO" -type f -name "$lib" -print

            if ! find "$DEVKITPRO" -type f -name "$lib" \
              -print -quit | grep -q .; then
              echo "::error::Library not found: $lib"
              exit 1
            fi
          done

      - name: Verify decoder libraries
        shell: bash
        run: |
          set -eu

          LIB="third_party/decoder/lib"

          for lib in \
            libswresample.a \
            libavformat.a \
            libswscale.a \
            libavcodec.a \
            libavutil.a \
            libx264.a \
            libmp3lame.a \
            libdav1d.a \
            libcurl.a \
            libnghttp2.a \
            libmbedtls.a \
            libmbedx509.a \
            libmbedcrypto.a
          do
            if [ ! -s "$LIB/$lib" ]; then
              echo "::error::Missing decoder library: $LIB/$lib"
              exit 1
            fi
          done

      - name: Build Minimalvideoplayer
        shell: bash
        run: |
          set -eu

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          BUNDLED="third_party/decoder/lib/libctru.a"
          DISABLED="third_party/decoder/lib/libctru.a.disabled"

          if [ -e "$DISABLED" ]; then
            echo "::error::Unexpected leftover $DISABLED"
            exit 1
          fi

          restore_ctru() {
            if [ -e "$DISABLED" ]; then
              mv "$DISABLED" "$BUNDLED"
            fi
          }
          trap restore_ctru EXIT

          if [ -f "$BUNDLED" ]; then
            mv "$BUNDLED" "$DISABLED"
          fi

          make clean
          make -j2 V=1

          test -s Minimalvideoplayer.3dsx
          ls -lh Minimalvideoplayer.3dsx

      - name: Upload 3DSX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minimalvideoplayer-3dsx
          path: Minimalvideoplayer.3dsx
          if-no-files-found: error

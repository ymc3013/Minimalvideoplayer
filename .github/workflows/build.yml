
name: MinimalVideoPlayer - Autonomous Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build autonomous 3DS application
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check toolchain
        shell: bash
        run: |
          set -eu
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          command -v make
          command -v git

      - name: Get decoder libraries only
        shell: bash
        run: |
          set -eu
          git clone --depth 1 \
            https://github.com/Core-2-Extreme/Video_player_for_3DS.git \
            /tmp/decoder-deps

          test -d /tmp/decoder-deps/library/include
          test -d /tmp/decoder-deps/library/lib

          mkdir -p source library
          cp -a /tmp/decoder-deps/library/include library/
          cp -a /tmp/decoder-deps/library/lib library/

          # Copy the toolchain Makefile as a build template.
          cp /tmp/decoder-deps/Makefile ./Makefile

      - name: Generate autonomous source
        shell: bash
        run: |
          set -eu

          cat > source/main.c <<'EOF'
          #include <stdio.h>
          #include <string.h>

          #include <3ds.h>
          #include <libavformat/avformat.h>
          #include <libavcodec/avcodec.h>

          #define VIDEO_PATH "sdmc:/Movies/test.avi"

          int main(void)
          {
              gfxInitDefault();
              consoleInit(GFX_TOP, NULL);

              printf("MinimalVideoPlayer\n");
              printf("Autonomous decoder test\n\n");
              printf("File: %s\n\n", VIDEO_PATH);

              AVFormatContext *format = NULL;
              int result = avformat_open_input(
                  &format, VIDEO_PATH, NULL, NULL
              );

              if (result < 0) {
                  printf("ERROR: cannot open AVI.\n");
                  printf("Check sdmc:/Movies/test.avi\n");
                  goto wait_exit;
              }

              result = avformat_find_stream_info(format, NULL);
              if (result < 0) {
                  printf("ERROR: cannot read AVI streams.\n");
                  avformat_close_input(&format);
                  goto wait_exit;
              }

              int video_index = -1;
              int audio_index = -1;

              for (unsigned int i = 0; i < format->nb_streams; i++) {
                  AVCodecParameters *p = format->streams[i]->codecpar;

                  if (p->codec_type == AVMEDIA_TYPE_VIDEO)
                      video_index = (int)i;

                  if (p->codec_type == AVMEDIA_TYPE_AUDIO)
                      audio_index = (int)i;
              }

              printf("AVI opened successfully.\n");

              if (video_index >= 0) {
                  AVCodecParameters *p =
                      format->streams[video_index]->codecpar;
                  const AVCodec *decoder =
                      avcodec_find_decoder(p->codec_id);

                  printf("Video: %dx%d\n", p->width, p->height);
                  printf("Video codec: %s\n",
                      decoder ? decoder->name : "unsupported");
              } else {
                  printf("No video stream found.\n");
              }

              if (audio_index >= 0) {
                  AVCodecParameters *p =
                      format->streams[audio_index]->codecpar;
                  const AVCodec *decoder =
                      avcodec_find_decoder(p->codec_id);

                  printf("Audio codec: %s\n",
                      decoder ? decoder->name : "unsupported");
              } else {
                  printf("No audio stream found.\n");
              }

              printf("\nDecoder library check complete.\n");
              printf("This build does not render video or play audio yet.\n");

              avformat_close_input(&format);

          wait_exit:
              printf("\nPress START to exit.");

              while (aptMainLoop()) {
                  hidScanInput();

                  if (hidKeysDown() & KEY_START)
                      break;

                  gfxFlushBuffers();
                  gfxSwapBuffers();
                  gspWaitForVBlank();
              }

              gfxExit();
              return 0;
          }
          EOF

      - name: Configure our own application
        shell: bash
        run: |
          set -eu

          python3 - <<'PY'
          from pathlib import Path

          p = Path("Makefile")
          s = p.read_text()

          s = s.replace(
              "TARGET\t\t:=\t$(notdir $(CURDIR))",
              "TARGET\t\t:=\tMinimalvideoplayer"
          )
          s = s.replace(
              "SOURCES\t\t:=\tsource source/system source/system/util source/system/draw",
              "SOURCES\t\t:=\tsource"
          )
          s = s.replace(
              "INCLUDES\t:=\tinclude library/include",
              "INCLUDES\t:=\tlibrary/include"
          )
          s = s.replace(
              "DATA\t\t:=\tdata",
              "DATA\t\t:=\tdata"
          )
          s = s.replace(
              "APP_TITLE\t\t\t:= Video player for 3DS",
              "APP_TITLE\t\t\t:= MinimalVideoPlayer"
          )
          s = s.replace(
              "APP_DESCRIPTION\t\t:= Video player for 3DS v1.8.0",
              "APP_DESCRIPTION\t\t:= Autonomous AVI decoder test"
          )
          s = s.replace(
              "APP_AUTHOR\t\t\t:= Core_2_Extreme",
              "APP_AUTHOR\t\t\t:= ymc3013"
          )

          p.write_text(s)
          PY

      - name: Compile
        shell: bash
        run: |
          set -eu
          make clean || true
          make 3dsx

          test -s Minimalvideoplayer.3dsx
          mkdir -p output
          cp Minimalvideoplayer.3dsx output/
          ls -lh output/

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Minimalvideoplayer-3DSX
          path: output/Minimalvideoplayer.3dsx
          if-no-files-found: error
          retention-days: 14

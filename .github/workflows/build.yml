
name: Build Minimalvideoplayer

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'Makefile'
      - 'source/**'
      - 'third_party/decoder/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 3DSX
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure devkitPro
        shell: bash
        run: |
          set -eu

          test -n "${DEVKITPRO:-}" || {
            echo "::error::DEVKITPRO is not configured."
            exit 1
          }

          test -n "${DEVKITARM:-}" || {
            echo "::error::DEVKITARM is not configured."
            exit 1
          }

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"

          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          make --version

      - name: Install 3DS development packages
        shell: bash
        run: |
          set -eu

          if ! command -v dkp-pacman >/dev/null 2>&1; then
            echo "::error::dkp-pacman is unavailable in this image."
            exit 1
          fi

          dkp-pacman -Syu --noconfirm 3ds-dev

      - name: Inspect SDK libraries
        shell: bash
        run: |
          set -eu

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          find "$DEVKITPRO" -type f \
            \( -name 'libctru.a' \
            -o -name 'libcitro2d.a' \
            -o -name 'libcitro3d.a' \
            -o -name 'libz.a' \) -print

          for lib in libctru.a libcitro2d.a libcitro3d.a libz.a; do
            if ! find "$DEVKITPRO" -type f -name "$lib" \
              -print -quit | grep -q .; then
              echo "::error::Required SDK library not found: $lib"
              exit 1
            fi
          done

          test -f "$DEVKITARM/3ds_rules"

      - name: Verify project and decoder archives
        shell: bash
        run: |
          set -eu

          for file in \
            Makefile \
            source/main.c \
            source/avi.c \
            source/video.c \
            source/audio.c
          do
            test -f "$file" || {
              echo "::error::Missing file: $file"
              exit 1
            }
          done

          LIB="third_party/decoder/lib"

          # Support the alternate libavutil filename previously found.
          if [ ! -f "$LIB/libavutil.a" ] &&
             [ -f "$LIB/lubavutil.a" ]; then
            ln -s lubavutil.a "$LIB/libavutil.a"
          fi

          # Support the extensionless filename previously reported.
          if [ ! -f "$LIB/libnghttp2.a" ] &&
             [ -f "$LIB/libnghttp2." ]; then
            ln -s 'libnghttp2.' "$LIB/libnghttp2.a"
          fi

          for lib in \
            libswresample.a \
            libavformat.a \
            libswscale.a \
            libavcodec.a \
            libavutil.a \
            libx264.a \
            libmp3lame.a \
            libdav1d.a \
            libcurl.a \
            libnghttp2.a \
            libmbedtls.a \
            libmbedx509.a \
            libmbedcrypto.a
          do
            if [ ! -s "$LIB/$lib" ]; then
              echo "::error::Missing or empty archive: $LIB/$lib"
              exit 1
            fi
          done

          echo "Decoder archive checks passed."

      - name: Build Minimalvideoplayer
        shell: bash
        run: |
          set -eu

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          # Do not use the bundled libctru archive.
          BUNDLED="third_party/decoder/lib/libctru.a"
          DISABLED="third_party/decoder/lib/libctru.a.disabled"

          if [ -e "$DISABLED" ]; then
            echo "::error::Unexpected leftover $DISABLED"
            exit 1
          fi

          restore_ctru() {
            if [ -e "$DISABLED" ]; then
              mv "$DISABLED" "$BUNDLED"
            fi
          }
          trap restore_ctru EXIT

          if [ -f "$BUNDLED" ]; then
            mv "$BUNDLED" "$DISABLED"
          fi

          make clean
          make -j2 V=1

          test -s Minimalvideoplayer.3dsx
          ls -lh Minimalvideoplayer.3dsx

      - name: Upload 3DSX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minimalvideoplayer-3dsx
          path: Minimalvideoplayer.3dsx
          if-no-files-found: error

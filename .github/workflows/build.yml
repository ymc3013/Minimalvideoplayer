
name: MinimalVideoPlayer - Full AVI Video and Audio

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 3DS video player
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check toolchain
        shell: bash
        run: |
          set -eu
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          test -f "$DEVKITARM/3ds_rules"
          command -v make
          command -v git
          command -v python3

      - name: Fetch decoder libraries
        shell: bash
        run: |
          set -eu
          git clone --depth 1 \
            https://github.com/Core-2-Extreme/Video_player_for_3DS.git \
            /tmp/reference

          test -d /tmp/reference/library/include
          test -d /tmp/reference/library/lib
          test -f /tmp/reference/Makefile

          mkdir -p source library/include library/lib

          cp -a /tmp/reference/library/include/. library/include/
          cp -a /tmp/reference/library/lib/. library/lib/

          for lib in avformat avcodec avutil swscale swresample; do
            test -f "library/lib/lib${lib}.a" || {
              echo "Missing decoder library: lib${lib}.a"
              exit 1
            }
          done

      - name: Generate standalone video player
        shell: bash
        run: |
          set -eu
          cat > source/main.c <<'EOF'
          #include <3ds.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <string.h>
          #include <time.h>

          #include <libavformat/avformat.h>
          #include <libavcodec/avcodec.h>
          #include <libavutil/imgutils.h>
          #include <libavutil/opt.h>
          #include <libavutil/time.h>
          #include <libswscale/swscale.h>
          #include <libswresample/swresample.h>

          #define VIDEO_PATH "sdmc:/Movies/test.avi"
          #define SCREEN_W 400
          #define SCREEN_H 240
          #define AUDIO_RATE 44100
          #define AUDIO_CHANNELS 2
          #define AUDIO_SAMPLES 4096

          static SwsContext *scaler;
          static SwrContext *resampler;
          static uint8_t *rgb_buffer;
          static uint8_t *audio_buffers[2];
          static ndspWaveBuf wave[2];
          static int audio_slot;
          static int audio_ready;

          static int show_frame(AVFrame *frame)
          {
              u16 width = 0, height = 0;
              uint8_t *fb;
              int stride[4] = { SCREEN_W * 3, 0, 0, 0 };
              uint8_t *dst[4] = { rgb_buffer, NULL, NULL, NULL };

              scaler = sws_getCachedContext(
                  scaler,
                  frame->width, frame->height,
                  (enum AVPixelFormat)frame->format,
                  SCREEN_W, SCREEN_H,
                  AV_PIX_FMT_BGR24,
                  SWS_BILINEAR, NULL, NULL, NULL
              );
              if (!scaler)
                  return -1;

              if (sws_scale(
                  scaler,
                  (const uint8_t * const *)frame->data,
                  frame->linesize,
                  0, frame->height,
                  dst, stride
              ) <= 0)
                  return -1;

              fb = gfxGetFramebuffer(GFX_TOP, GFX_LEFT, &width, &height);
              if (!fb || width != SCREEN_W || height != SCREEN_H)
                  return -1;

              for (int y = 0; y < SCREEN_H; ++y) {
                  for (int x = 0; x < SCREEN_W; ++x) {
                      size_t src = ((size_t)y * SCREEN_W + x) * 3;
                      size_t pos =
                          ((size_t)x * SCREEN_H + (SCREEN_H - 1 - y)) * 3;
                      fb[pos] = rgb_buffer[src];
                      fb[pos + 1] = rgb_buffer[src + 1];
                      fb[pos + 2] = rgb_buffer[src + 2];
                  }
              }
              return 0;
          }

          static int play_audio_frame(AVFrame *frame)
          {
              if (!resampler || !frame)
                  return 0;

              int capacity = swr_get_out_samples(resampler, frame->nb_samples);
              if (capacity <= 0)
                  return 0;

              if (capacity > AUDIO_SAMPLES)
                  capacity = AUDIO_SAMPLES;

              uint8_t *out[1] = { audio_buffers[audio_slot] };
              int samples = swr_convert(
                  resampler, out, capacity,
                  (const uint8_t **)frame->extended_data,
                  frame->nb_samples
              );
              if (samples <= 0)
                  return 0;

              while (aptMainLoop() && wave[audio_slot].status == NDSP_WBUF_PLAYING)
                  svcSleepThread(1000000LL);

              if (!aptMainLoop())
                  return -1;

              wave[audio_slot].data_vaddr = audio_buffers[audio_slot];
              wave[audio_slot].nsamples = samples;
              wave[audio_slot].looping = false;
              DSP_FlushDataCache(audio_buffers[audio_slot],
                                 (u32)samples * AUDIO_CHANNELS * sizeof(int16_t));
              ndspChnWaveBufAdd(0, &wave[audio_slot]);
              audio_slot ^= 1;
              audio_ready = 1;
              return 0;
          }

          int main(void)
          {
              AVFormatContext *fmt = NULL;
              AVCodecContext *vctx = NULL, *actx = NULL;
              AVPacket *packet = NULL;
              AVFrame *frame = NULL;
              const AVCodec *vcodec = NULL, *acodec = NULL;
              int vs = -1, as = -1;
              int status = 1;
              int64_t start_us = 0;
              int64_t first_pts = AV_NOPTS_VALUE;

              gfxInitDefault();
              consoleInit(GFX_BOTTOM, NULL);
              ndspInit();
              ndspSetOutputMode(NDSP_OUTPUT_STEREO);

              rgb_buffer = malloc(SCREEN_W * SCREEN_H * 3);
              audio_buffers[0] = linearAlloc(
                  AUDIO_SAMPLES * AUDIO_CHANNELS * sizeof(int16_t));
              audio_buffers[1] = linearAlloc(
                  AUDIO_SAMPLES * AUDIO_CHANNELS * sizeof(int16_t));

              if (!rgb_buffer || !audio_buffers[0] || !audio_buffers[1]) {
                  printf("Not enough memory\n");
                  goto cleanup;
              }

              memset(wave, 0, sizeof(wave));
              ndspChnReset(0);
              ndspChnSetInterp(0, NDSP_INTERP_LINEAR);
              ndspChnSetRate(0, AUDIO_RATE);
              ndspChnSetFormat(0, NDSP_FORMAT_STEREO_PCM16);

              printf("Opening %s\n", VIDEO_PATH);
              if (avformat_open_input(&fmt, VIDEO_PATH, NULL, NULL) < 0 ||
                  avformat_find_stream_info(fmt, NULL) < 0) {
                  printf("Cannot open AVI file\n");
                  goto cleanup;
              }

              vs = av_find_best_stream(fmt, AVMEDIA_TYPE_VIDEO, -1, -1,
                                       &vcodec, 0);
              as = av_find_best_stream(fmt, AVMEDIA_TYPE_AUDIO, -1, -1,
                                       &acodec, 0);

              if (vs < 0 || !vcodec) {
                  printf("No video stream\n");
                  goto cleanup;
              }

              vctx = avcodec_alloc_context3(vcodec);
              if (!vctx ||
                  avcodec_parameters_to_context(vctx, fmt->streams[vs]->codecpar) < 0 ||
                  avcodec_open2(vctx, vcodec, NULL) < 0) {
                  printf("Cannot initialize video decoder\n");
                  goto cleanup;
              }

              if (as >= 0 && acodec) {
                  actx = avcodec_alloc_context3(acodec);
                  if (actx &&
                      avcodec_parameters_to_context(
                          actx, fmt->streams[as]->codecpar) >= 0 &&
                      avcodec_open2(actx, acodec, NULL) >= 0) {
                      AVChannelLayout output_layout;
                      av_channel_layout_default(&output_layout, AUDIO_CHANNELS);

                      if (swr_alloc_set_opts2(
                          &resampler,
                          &output_layout, AV_SAMPLE_FMT_S16, AUDIO_RATE,
                          &actx->ch_layout, actx->sample_fmt, actx->sample_rate,
                          0, NULL
                      ) >= 0 && resampler && swr_init(resampler) >= 0) {
                          audio_ready = 1;
                      } else {
                          if (resampler) swr_free(&resampler);
                          printf("Audio conversion unavailable\n");
                      }
                      av_channel_layout_uninit(&output_layout);
                  } else {
                      if (actx) avcodec_free_context(&actx);
                      actx = NULL;
                      printf("MP3 decoder unavailable\n");
                  }
              }

              packet = av_packet_alloc();
              frame = av_frame_alloc();
              if (!packet || !frame) {
                  printf("Cannot allocate decoder buffers\n");
                  goto cleanup;
              }

              printf("Playing video and audio...\n");
              start_us = osGetTime() * 1000LL;

              while (aptMainLoop() && av_read_frame(fmt, packet) >= 0) {
                  AVCodecContext *ctx = NULL;
                  int stream = packet->stream_index;

                  if (stream == vs)
                      ctx = vctx;
                  else if (stream == as && actx)
                      ctx = actx;

                  if (ctx && avcodec_send_packet(ctx, packet) >= 0) {
                      while (avcodec_receive_frame(ctx, frame) >= 0) {
                          if (stream == vs) {
                              AVRational rate = fmt->streams[vs]->avg_frame_rate;
                              int64_t pts = frame->best_effort_timestamp;

                              if (pts != AV_NOPTS_VALUE) {
                                  int64_t frame_us = av_rescale_q(
                                      pts, fmt->streams[vs]->time_base,
                                      AV_TIME_BASE_Q);
                                  if (first_pts == AV_NOPTS_VALUE)
                                      first_pts = frame_us;

                                  int64_t target =
                                      start_us + (frame_us - first_pts);
                                  while (aptMainLoop() &&
                                         osGetTime() * 1000LL < target)
                                      svcSleepThread(1000000LL);
                              } else if (rate.num > 0 && rate.den > 0) {
                                  svcSleepThread(
                                      (int64_t)1000000000LL * rate.den / rate.num);
                              }

                              if (show_frame(frame) < 0) {
                                  printf("Frame display error\n");
                                  av_frame_unref(frame);
                                  av_packet_unref(packet);
                                  goto cleanup;
                              }
                          } else if (stream == as && actx) {
                              if (play_audio_frame(frame) < 0) {
                                  av_frame_unref(frame);
                                  av_packet_unref(packet);
                                  goto cleanup;
                              }
                          }
                          av_frame_unref(frame);
                      }
                  }
                  av_packet_unref(packet);
              }

              status = 0;
              printf("Playback ended\n");
              while (aptMainLoop())
                  gspWaitForVBlank();

          cleanup:
              if (packet) av_packet_free(&packet);
              if (frame) av_frame_free(&frame);
              if (vctx) avcodec_free_context(&vctx);
              if (actx) avcodec_free_context(&actx);
              if (fmt) avformat_close_input(&fmt);
              if (scaler) sws_freeContext(scaler);
              if (resampler) swr_free(&resampler);
              free(rgb_buffer);
              if (audio_buffers[0]) linearFree(audio_buffers[0]);
              if (audio_buffers[1]) linearFree(audio_buffers[1]);
              ndspExit();
              gfxExit();
              return status;
          }
          EOF

      - name: Generate Makefile
        shell: bash
        run: |
          set -eu
          cat > Makefile <<'EOF'
          .SUFFIXES:
          include $(DEVKITARM)/3ds_rules

          TARGET := Minimalvideoplayer
          BUILD := build
          SOURCES := source
          DATA :=
          INCLUDES := library/include
          GRAPHICS :=
          ROMFS :=
          APP_TITLE := MinimalVideoPlayer
          APP_DESCRIPTION := AVI video and MP3 audio player
          APP_AUTHOR := ymc3013
          ICON :=

          ARCH := -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft
          CFLAGS := -O2 -Wall -mword-relocations -ffunction-sections $(ARCH) -D__3DS__
          CFLAGS += $(foreach dir,$(INCLUDES),-I$(CURDIR)/$(dir))
          CFLAGS += -I$(CURDIR)/library/include
          LDFLAGS := -specs=3dsx.specs $(ARCH) -Wl,--gc-sections
          LIBS := -lavformat -lavcodec -lswresample -lswscale -lavutil -lctru -lm -lz
          LIBDIRS := library/lib

          ifneq ($(BUILD),$(notdir $(CURDIR)))
          export OUTPUT := $(CURDIR)/$(TARGET)
          export TOPDIR := $(CURDIR)
          export VPATH := $(foreach dir,$(SOURCES),$(CURDIR)/$(dir))
          export DEPSDIR := $(CURDIR)/$(BUILD)
          CFILES := $(foreach dir,$(SOURCES),$(notdir $(wildcard $(dir)/*.c)))
          export OFILES := $(CFILES:.c=.o)
          export INCLUDE := $(foreach dir,$(INCLUDES),-I$(CURDIR)/$(dir)) -I$(CURDIR)/library/include -I$(CURDIR)/$(BUILD)
          export LIBPATHS := $(foreach dir,$(LIBDIRS),-L$(CURDIR)/$(dir))
          export _3DSXDEPS := $(OUTPUT).smdh
          export APP_ICON := $(CURDIR)/icon.png
          .PHONY: all 3dsx clean
          all: 3dsx
          3dsx: $(BUILD) $(DEPSDIR)
          	@$(MAKE) -C $(BUILD) -f $(CURDIR)/Makefile
          $(BUILD):
          	@mkdir -p $@
          $(DEPSDIR):
          	@mkdir -p $@
          clean:
          	@rm -rf $(BUILD) $(TARGET).3dsx $(TARGET).elf $(TARGET).smdh
          else
          export LD := $(CC)
          export OFILES_BIN :=
          export HFILES :=
          export INCLUDE
          export LIBPATHS
          $(OUTPUT).3dsx: $(OUTPUT).elf $(OUTPUT).smdh
          $(OUTPUT).elf: $(OFILES)
          %.o: %.c
          	$(CC) $(CFLAGS) $(INCLUDE) -c $< -o $@
          endif
          EOF

          cat > icon.png.base64 <<'EOF'
          iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/FQAAAABJRU5ErkJggg==
          EOF
          base64 -d icon.png.base64 > icon.png
          rm icon.png.base64

      - name: Build 3DSX
        shell: bash
        run: |
          set -eu
          make 3dsx

      - name: Verify build artifacts
        shell: bash
        run: |
          set -eu
          test -s Minimalvideoplayer.3dsx
          ls -lh Minimalvideoplayer.3dsx

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: MinimalVideoPlayer-3DSX
          path: Minimalvideoplayer.3dsx
          if-no-files-found: error


name: Build Minimalvideoplayer

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'Makefile'
      - 'source/**'
      - 'third_party/decoder/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build 3DSX
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nintendo 3DS SDK
        shell: bash
        run: |
          set -eu

          if ! command -v dkp-pacman >/dev/null 2>&1; then
            echo "::error::devkitPro package manager is unavailable."
            exit 1
          fi

          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm 3ds-dev 3ds-zlib

      - name: Locate SDK libraries
        shell: bash
        run: |
          set -eu

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          for tool in arm-none-eabi-gcc make; do
            command -v "$tool"
          done

          test -f "$DEVKITARM/3ds_rules"

          for lib in \
            libctru.a \
            libcitro2d.a \
            libcitro3d.a \
            libz.a
          do
            echo "=== $lib ==="
            find "$DEVKITPRO" -type f -name "$lib" -print

            if ! find "$DEVKITPRO" -type f -name "$lib" \
              -print -quit | grep -q .; then
              echo "::error::SDK library missing: $lib"
              exit 1
            fi
          done

      - name: Verify decoder libraries
        shell: bash
        run: |
          set -eu

          LIB="third_party/decoder/lib"

          # Handle the alternate filenames previously reported.
          if [ ! -f "$LIB/libavutil.a" ] &&
             [ -f "$LIB/lubavutil.a" ]; then
            ln -s lubavutil.a "$LIB/libavutil.a"
          fi

          if [ ! -f "$LIB/libnghttp2.a" ] &&
             [ -f "$LIB/libnghttp2." ]; then
            ln -s 'libnghttp2.' "$LIB/libnghttp2.a"
          fi

          for lib in \
            libswresample.a \
            libavformat.a \
            libswscale.a \
            libavcodec.a \
            libavutil.a \
            libx264.a \
            libmp3lame.a \
            libdav1d.a \
            libcurl.a \
            libnghttp2.a \
            libmbedtls.a \
            libmbedx509.a \
            libmbedcrypto.a
          do
            if [ ! -s "$LIB/$lib" ]; then
              echo "::error::Missing decoder archive: $LIB/$lib"
              exit 1
            fi
          done

      - name: Build Minimalvideoplayer
        shell: bash
        run: |
          set -eu

          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"

          # Temporarily exclude the bundled libctru archive.
          BUNDLED="third_party/decoder/lib/libctru.a"
          DISABLED="third_party/decoder/lib/libctru.a.disabled"

          if [ -e "$DISABLED" ]; then
            echo "::error::Unexpected leftover $DISABLED"
            exit 1
          fi

          restore_ctru() {
            if [ -e "$DISABLED" ]; then
              mv "$DISABLED" "$BUNDLED"
            fi
          }
          trap restore_ctru EXIT

          if [ -f "$BUNDLED" ]; then
            mv "$BUNDLED" "$DISABLED"
          fi

          make clean
          make -j2 V=1

          test -s Minimalvideoplayer.3dsx
          ls -lh Minimalvideoplayer.3dsx

      - name: Upload 3DSX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minimalvideoplayer-3dsx
          path: Minimalvideoplayer.3dsx
          if-no-files-found: error

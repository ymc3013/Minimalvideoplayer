name: Build Minimalvideoplayer

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare FFmpeg libraries
        shell: bash
        run: |
          set -eux

          git clone --depth 1 \
            https://github.com/Core-2-Extreme/Video_player_for_3DS.git \
            /tmp/3ds-reference

          mkdir -p library/include library/lib build

          cp -a /tmp/3ds-reference/library/include/. library/include/
          cp -a /tmp/3ds-reference/library/lib/. library/lib/
          rm -f library/lib/libctru.a

      - name: Generate Makefile
        shell: bash
        run: |
          set -eux

          cat > Makefile <<'MAKEFILE'
          .DEFAULT_GOAL := all

          TARGET := Minimalvideoplayer
          BUILD := build
          SOURCES := source
          INCLUDES := include library/include

          ARCH := -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft

          CFLAGS := -g -O2 -Wall -ffunction-sections -fdata-sections $(ARCH)
          CFLAGS += -D__3DS__
          CXXFLAGS := $(CFLAGS) -fno-rtti -fno-exceptions
          ASFLAGS := $(ARCH)
          LDFLAGS := -specs=3dsx.specs $(ARCH) -Wl,--gc-sections

          LIBDIRS := library/lib
          LIBS := -lswresample -lavformat -lswscale -lavcodec -lavutil
          LIBS += -lx264 -lmp3lame -ldav1d -lz -lm -lctru

          APP_TITLE := Minimal Video Player
          APP_DESCRIPTION := Automatic AVI Player
          APP_AUTHOR := ymc3013
          APP_ICON := $(DEVKITPRO)/libctru/default_icon.png

          .PHONY: all clean
          all:
          	$(MAKE) --no-print-directory -f $(DEVKITARM)/3ds_rules

          clean:
          	rm -rf $(BUILD) $(TARGET).elf $(TARGET).3dsx $(TARGET).smdh

          include $(DEVKITARM)/3ds_rules
          MAKEFILE

          # Remove the incorrect recursive target if present in the generated file.
          # The actual devkitPro rules are included at the end of this Makefile.

      - name: Build application
        shell: bash
        run: |
          set -eux
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          rm -rf build
          make

      - name: Verify output
        run: test -s Minimalvideoplayer.3dsx

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Minimalvideoplayer-3DS
          path: Minimalvideoplayer.3dsx
          if-no-files-found: error